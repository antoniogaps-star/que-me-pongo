    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, X). Sin esto el
         enlace se ve como texto pelón; con esto llega con portada y descripción,
         que es justo lo que hace que un prospecto le dé clic. Las URLs deben ser
         absolutas: las redes no resuelven rutas relativas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="¿Qué me pongo?" />
    <meta property="og:title" content="¿Qué me pongo? — Tu clóset. Tu estilo. Tu mejor versión." />
    <meta
      property="og:description"
      content="Fotografía tu ropa una vez y deja que un asesor de imagen te vista todos los días, con lo que ya tienes. Prueba gratis 7 días."
    />
    <meta property="og:image" content="https://que-me-pongo-theta.vercel.app/portada.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:url" content="https://que-me-pongo-theta.vercel.app/inicio" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0B0C" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
