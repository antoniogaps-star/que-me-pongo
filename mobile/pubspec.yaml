name: quemepongo_mobile
description: "¿Qué me pongo? — Asesor de imagen personal, offline-first (Flutter + SQLite)."
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Base local cifrada (SQLCipher)
  drift: ^2.21.0
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.4.6
  # Estado / DI
  flutter_riverpod: ^2.6.1
  # Modelos inmutables
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # Red
  dio: ^5.7.0
  # Seguridad e identificadores
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  # Cámara y galería: la foto de cada prenda del clóset
  image_picker: ^1.1.2
  # Detectar permiso de cámara bloqueado y abrir los ajustes de la app
  permission_handler: ^11.3.1
  # Abrir enlaces (planes, soporte)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  # Negro de la marca: el gancho dorado se recorta sobre él en el ícono adaptativo.
  adaptive_icon_background: "#0B0B0C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/branding/logo_mark.png
