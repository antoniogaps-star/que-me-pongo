<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Símbolo de "¿Qué me pongo?": un gancho de ropa que ES un signo de interrogación.
       Dice el nombre de la app sin palabras. Vector puro para que aguante desde
       el ícono de 48px hasta el splash de pantalla completa. -->
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CFA0"/>
      <stop offset="55%" stop-color="#D4B483"/>
      <stop offset="100%" stop-color="#B8935C"/>
    </linearGradient>
  </defs>

  <!-- Marco redondeado (contenedor del símbolo) -->
  <rect x="46" y="46" width="420" height="420" rx="104" ry="104"
        fill="none" stroke="url(#oro)" stroke-width="16"/>

  <!-- El gancho: barra inferior y hombros en diagonal -->
  <path d="M 136 350 L 376 350"
        fill="none" stroke="url(#oro)" stroke-width="17"
        stroke-linecap="round"/>
  <path d="M 136 350 L 256 268 L 376 350"
        fill="none" stroke="url(#oro)" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- El signo de interrogación: su curva hace las veces del cuello del gancho -->
  <path d="M 214 176
           a 44 44 0 1 1 46 60
           l 0 24"
        fill="none" stroke="url(#oro)" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="260" cy="306" r="10" fill="url(#oro)"/>
</svg>
