<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Símbolo de "¿Qué me pongo?".
       Tiene DOS interrogantes: el colgador del gancho es uno, y otro más grande
       atraviesa la barra — que se parte en dos para dejarlo pasar.
       Versión SVG para la web; los PNG del móvil salen de brand/generate_brand.py. -->
  <g fill="none" stroke="#D4B483" stroke-linecap="round" stroke-linejoin="round">
    <!-- Marco redondeado -->
    <rect x="46" y="46" width="420" height="420" rx="104" ry="104" stroke-width="16"/>

    <g stroke-width="17">
      <!-- Hombros del gancho -->
      <path d="M 83 333 L 256 231 L 429 333"/>
      <!-- Barra partida: el hueco central es por donde pasa el interrogante grande -->
      <path d="M 83 333 L 214 333"/>
      <path d="M 298 333 L 429 333"/>

      <!-- Interrogante de arriba: es el colgador -->
      <path d="M 214 145 A 42 42 0 1 1 277 181 L 256 224"/>

      <!-- Interrogante grande: cruza la barra -->
      <path d="M 222 303 A 34 34 0 1 1 273 332 L 256 360"/>
    </g>
  </g>
  <!-- El punto del interrogante grande, ya debajo de la barra -->
  <circle cx="256" cy="392" r="13" fill="#D4B483"/>
</svg>
